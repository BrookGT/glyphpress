
[package]
name = "glyphpress-fuzz"
version.workspace = true
edition.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
glyphpress-core = { path = "../glyphpress-core" }

[features]
libfuzzer = ["dep:libfuzzer-sys"]

[[bin]]
name = "sfnt_fuzzer"
path = "fuzz_targets/sfnt_fuzzer.rs"
test = false
required-features = ["libfuzzer"]

[[bin]]
name = "cmap_fuzzer"
path = "fuzz_targets/cmap_fuzzer.rs"
test = false
required-features = ["libfuzzer"]

[[bin]]
name = "glyf_fuzzer"
path = "fuzz_targets/glyf_fuzzer.rs"
test = false
required-features = ["libfuzzer"]

[[bin]]
name = "post_fuzzer"
path = "fuzz_targets/post_fuzzer.rs"
test = false
required-features = ["libfuzzer"]

[[bin]]
name = "pipeline_fuzzer"
path = "fuzz_targets/pipeline_fuzzer.rs"
test = false
required-features = ["libfuzzer"]
